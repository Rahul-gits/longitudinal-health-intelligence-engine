version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Heal Engine Core Application (Express BFF + Vite Static Assets)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: heal-engine-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://heal_user:${POSTGRES_PASSWORD:-secure_heal_engine_pass}@timescaledb:5432/heal_engine_db
      - REDIS_URL=redis://redis:6379
      - VECTOR_DB_HOST=vectordb
      - VECTOR_DB_PORT=6333
      - JWT_SECRET=${JWT_SECRET:-change_in_production_super_secret_64char_key}
      - KMS_KEY_ID=${KMS_KEY_ID:-arn:aws:kms:us-east-1:123456789012:key/heal-audit}
      - CORS_ALLOWED_ORIGINS=https://healengine.hospital.org,http://localhost:5173
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      vectordb:
        condition: service_started
    networks:
      - clinical_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB (Hypertables for continuous telemetry & WORM ledger)
  # ----------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: heal-engine-timescaledb
    restart: always
    environment:
      - POSTGRES_DB=heal_engine_db
      - POSTGRES_USER=heal_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_heal_engine_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - clinical_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heal_user -d heal_engine_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis (Distributed asynchronous BullMQ queue & idempotency keys)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: heal-engine-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secure_redis_pass}
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - clinical_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Qdrant Vector Database (KDIGO, ADA, ACC/AHA Guideline Chunks & Embeddings)
  # ----------------------------------------------------------------------------
  vectordb:
    image: qdrant/qdrant:latest
    container_name: heal-engine-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - clinical_internal

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  qdrantdata:
    driver: local

networks:
  clinical_internal:
    driver: bridge
